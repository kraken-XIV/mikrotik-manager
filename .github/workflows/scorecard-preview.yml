name: OpenSSF Scorecard preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    name: Scorecard preview (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0 peeled commit
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
